<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cousins and Their Role</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#4facfe,#00f2fe,#8e44ad);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
background:white;
width:95%;
max-width:700px;
border-radius:25px;
padding:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.3);
animation:fade 1s;
}

h1{
color:#6a11cb;
margin-bottom:10px;
}

.subtitle{
margin-bottom:20px;
color:#555;
}

button{
padding:12px 25px;
margin:8px;
border:none;
border-radius:30px;
background:#6a11cb;
color:white;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
background:#2575fc;
}

.hidden{
display:none;
}

.list button{
display:block;
width:90%;
margin:10px auto;
background:#ff6b81;
}

.card{
margin-top:20px;
padding:20px;
background:#f4f4ff;
border-radius:20px;
font-size:20px;
font-weight:bold;
color:#333;
animation:popup .5s;
}

@keyframes popup{
from{
opacity:0;
transform:scale(.5);
}
to{
opacity:1;
transform:scale(1);
}
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}

.closet{
animation:closet .8s;
}

@keyframes closet{
0%{transform:rotateY(90deg);opacity:0;}
100%{transform:rotateY(0);opacity:1;}
}

.elevator{
animation:elevator .8s;
}

@keyframes elevator{
0%{
transform:translateY(250px);
opacity:0;
}
100%{
transform:translateY(0);
opacity:1;
}
}
</style>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>👨‍👩‍👧‍👦 Cousins and Their Role 💖</h1>

<p class="subtitle">
Welcome to our amazing cousins page! 😎✨
</p>

<button onclick="showGender()">📂 Click For Details</button>

<div id="gender" class="hidden">
<button onclick="male()">👦 Male</button>
<button onclick="female()">👧 Female</button>
</div>

<div id="names" class="list"></div>

<div id="result"></div>

</div>

<script>

const males={
"Salim":"🤝 The one who gets close with everyone from babies to mommies 😂❤️ and obsessed with chubby girls 🍔💖",

"Ziyad":"😡 The angry guy 💢 and the ቸከስ ፈጂ 😂",

"Ahmed":"🤣 The ፈሳም and always ግልፍጥ 😅",

"Huzeyf":"⚡ The ፈጥኖ ያደገው ልጅ 👦❤️ also አፍቃሪ of his cousin (Hiba).",

"Merwan":"🕵️‍♂️ The unfound guy 😂 and always a problem maker 💥"
};

const females={
"Yusri":"😊 The innocent girl 🌸 and አስለፍላፊ 😂 also ትዳርless 💍❌",

"Situ":"👑 The big one and feared one 😎 also ትዳርless 💍❌",

"Aza":"👶 Mother of baby ❤️ and አይናፋር 🌹",

"Mina":"😒 The አኩራፊ one 😂",

"Intisar":"🕌 The real Muslim 🤲 and the Ibada gurllll 💖✨"
};

function showGender(){
document.getElementById("gender").classList.remove("hidden");
}

function male(){
showNames(males);
}

function female(){
showNames(females);
}

function showNames(obj){

let html="";

for(let name in obj){

html+=`<button onclick="showInfo('${name}')">${name}</button>`;

}

window.current=obj;

document.getElementById("names").innerHTML=html;

document.getElementById("result").innerHTML="";
}

function showInfo(name){

let cls="card";

if(name==="Ahmed"){
cls+=" closet";
}

if(name==="Huzeyf"){
cls+=" elevator";
}

document.getElementById("result").innerHTML=
`<div class="${cls}">
<h2>🎉 ${name}</h2>
<p>${current[name]}</p>
</div>`;

}

</script>

<script src="script.js"></script>
</body>
</html>
